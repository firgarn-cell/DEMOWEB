{% extends "base.html" %}
{% block title %}Новая заявка — гражданам.егрн{% endblock %}
{% block content %}
<section class="auth-wide">
  <h1>Формирование заявки</h1>
  <form method="post" id="app-form" novalidate>
    <label>Вид услуги
      <select name="service_name" required>
        <option value="">— выберите услугу —</option>
        {% for s in services %}
          <option value="{{ s }}" {% if form.service_name == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
      <span class="field-error {% if errors.service_name %}show{% endif %}">{{ errors.service_name or '' }}</span>
    </label>
    <label>Желаемая дата получения (ДД.ММ.ГГГГ)
      <input name="request_date" id="request_date" value="{{ form.request_date }}"
             placeholder="15.09.2026"
             pattern="(0[1-9]|[12]\d|3[01])\.(0[1-9]|1[0-2])\.\d{4}" required />
      <span class="field-error {% if errors.request_date %}show{% endif %}">{{ errors.request_date or 'Формат ДД.ММ.ГГГГ' }}</span>
    </label>
    <fieldset class="pay-fieldset">
      <legend>Способ оплаты</legend>
      <label class="radio">
        <input type="radio" name="payment_method" value="cash"
               {% if form.payment_method == 'cash' %}checked{% endif %} /> Наличными
      </label>
      <label class="radio">
        <input type="radio" name="payment_method" value="phone_transfer"
               {% if form.payment_method == 'phone_transfer' %}checked{% endif %} /> Переводом по номеру телефона
      </label>
      <span class="field-error {% if errors.payment_method %}show{% endif %}">{{ errors.payment_method or '' }}</span>
    </fieldset>
    <button class="btn" type="submit">Отправить</button>
    <a class="btn btn-ghost" href="{{ url_for('my_applications') }}">Отмена</a>
  </form>
</section>
{% endblock %}
